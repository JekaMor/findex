name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (Python version from .python-version, deps from uv.lock)
        run: uv sync --locked --extra semantic  # pyright checks the fastembed calls too
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: pyright (strict)
        run: uv run pyright
      - name: pytest
        run: uv run pytest --cov --cov-report=term
      - name: Benchmarks (timed; the table goes to the run summary)
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv run pytest tests/test_benchmarks.py --benchmark-enable --benchmark-only --benchmark-json=benchmark.json -p no:cacheprovider
          uv run python scripts/benchmark_summary.py benchmark.json >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the benchmark numbers
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.json
      - name: Build the wheel and run it in a clean environment
        shell: bash
        run: |
          uv build
          uvx --from dist/findex-*.whl findex --help

  free-threaded:
    name: tests on free-threaded 3.14t (no GIL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install on the free-threaded build
        run: uv sync --locked --python 3.14t
      - name: The GIL is really off
        run: uv run --python 3.14t python -c "import sys; print(sys.version); assert not sys._is_gil_enabled()"
      - name: pytest
        run: uv run --python 3.14t pytest

  docker:
    name: docker image (build, run as non-root, probe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (two stages, from uv.lock)
        run: docker build -t findex .
      - name: Run it and search it
        run: |
          docker run -d --name findex -p 8000:8000 findex
          for i in $(seq 1 40); do curl -fs localhost:8000/health && break; sleep 1; done
          echo
          curl -fs "localhost:8000/search?q=white+whale&k=3" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['total'] > 0, d; print(d['results'][0]['title'])"
          curl -fs -o /dev/null "localhost:8000/?q=white+whale"
          curl -fs "localhost:8000/search?q=an+undead+nobleman+who+feeds+on+the+living&mode=semantic&k=3" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['results'], d; print(d['mode'], d['results'][0]['title'])"
          docker stats --no-stream findex
          test "$(docker exec findex id -u)" != "0"
          docker logs findex
      - name: A bad INDEX_PATH stops it at start-up
        run: |
          if docker run --rm -e INDEX_PATH=/nope.bin findex; then exit 1; fi
