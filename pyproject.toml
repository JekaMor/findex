[project]
name = "findex"
version = "0.7.0"
description = "A small full-text search engine: streaming tokenizer, inverted index, BM25 ranking, CLI"
readme = "README.md"
authors = [
    { name = "Мороз Євген", email = "8109517@stud.kai.edu.ua" }
]
requires-python = ">=3.14"
keywords = ["search", "inverted-index", "bm25", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.3",
    "rich>=15.0.0",
    "typer>=0.29.2",
    "uvicorn>=0.54.0",
]

[project.urls]
Repository = "https://github.com/JekaMor/findex"

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
bench = [
    "matplotlib>=3.11.2",
]
dev = [
    "hypothesis>=6.170.17",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = ["slow: takes more than a second (deselect with -m 'not slow')"]

[tool.coverage.run]
source = ["findex"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
